[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-rag-backend"
version = "0.1.0"
description = "FastAPI + LangGraph RAG backend for the Agentic AI eBook chatbot"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "chromadb>=0.5",
    "langgraph>=0.2",
    "pypdf>=4.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["app", "app.rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
